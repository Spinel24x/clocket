<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - VLESS Panel</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header class="main-header">
            <h1>🚀 VLESS Panel</h1>
            <div class="header-actions">
                <span id="cfStatus"></span>
                <button class="btn-logout" onclick="logout()">🚪 Logout</button>
            </div>
        </header>

        <div class="card">
            <h3>➕ Create New Config</h3>
            <form id="addConfigForm" class="inline-form">
                <input type="text" id="cfgName" placeholder="Config Name">
                <input type="text" id="cfgRemarks" placeholder="Remarks">
                <button type="submit" class="btn-primary">Create</button>
            </form>
        </div>
        <div class="card">
            <h3>📋 Configs List</h3>
            <div id="configsList">Loading...</div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="/script.js"></script>
</body>
</html>
