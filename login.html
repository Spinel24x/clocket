<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login</title><link rel="stylesheet" href="/style.css"></head><body><div class="container"><div class="login-card"><div class="login-header"><h1>VLESS Panel</h1></div><form id="f"><div class="form-group"><label>Password</label><input type="password" id="pw" required></div><div class="error-message" id="e"></div><button type="submit" class="btn-login">Login</button></form></div></div><script>document.getElementById('f').onsubmit=async function(ev){ev.preventDefault();document.getElementById('e').style.display='none';try{var r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'password='+encodeURIComponent(document.getElementById('pw').value)});var d=await r.json();if(r.ok){window.location.href='/dashboard.html';}else{document.getElementById('e').textContent=d.detail||'Error';document.getElementById('e').style.display='block';}}catch(ex){document.getElementById('e').textContent='Connection error';document.getElementById('e').style.display='block';}};</script></body></html>
